<!doctype html>
<!--
  The share card: public/og-image.png (1200x630), the og:image and
  twitter:image of index.html and landing/index.html. This file is its
  source; the PNG is a screenshot of it. After an edit, from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=public/og-image.png scripts/og-image.html

  The fonts come from Google Fonts (the app's three faces, nothing else), so
  render it online; the time budget lets them arrive before the shot. Look
  at the PNG afterwards: a face that did not load falls back silently.

  The words are the dashboard's (round 13): its title, one clause to a line
  with the second in the accent, and its lede. The stage is the app's: the
  dark theme's colours and aurora (DESIGN.md), and no grid or dot pattern
  behind anything.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kleros Curate share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --stage: #02040b;
        --text: #f4f6fb;
        --text-muted: #a1abc0;
        --text-faint: #7a849e;
        --primary: #3d7bff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--stage);
        color: var(--text);
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * The aurora, as the app paints it behind the top of a page: an
       * aurora-a pool at the top left, an aurora-b pool at the top right,
       * and a faint aurora-c pool under the mark. A plain glow, nothing
       * patterned over it.
       */
      .aurora {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 560px 330px at 110px -30px,
            rgba(27, 47, 255, 0.5),
            rgba(27, 47, 255, 0.24) 38%,
            rgba(27, 47, 255, 0.07) 72%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 540px 340px at 1060px -40px,
            rgba(10, 124, 255, 0.42),
            rgba(10, 124, 255, 0.18) 45%,
            rgba(10, 124, 255, 0.04) 78%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 380px 150px at 930px 670px,
            rgba(91, 43, 255, 0.13),
            transparent 100%
          ),
          radial-gradient(
            circle 330px at 940px 318px,
            rgba(42, 74, 255, 0.17),
            rgba(42, 74, 255, 0.07) 55%,
            transparent 100%
          );
      }

      .brand {
        position: absolute;
        left: 77px;
        top: 66px;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand svg {
        display: block;
        width: 36px;
        height: 41px;
      }

      .brand span {
        font-size: 22px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.21em;
      }

      .copy {
        position: absolute;
        left: 76px;
        top: 178px;
        width: 680px;
      }

      h1 {
        font-family: 'Urbanist', sans-serif;
        font-size: 60px;
        font-weight: 500;
        line-height: 60px;
        letter-spacing: -0.04em;
      }

      h1 span,
      h1 em {
        display: block;
        text-wrap: balance;
      }

      h1 em {
        font-style: normal;
        color: var(--primary);
      }

      p {
        margin-top: 28px;
        color: var(--text-muted);
        font-size: 23px;
        line-height: 32px;
        text-wrap: balance;
      }

      .site {
        position: absolute;
        left: 76px;
        top: 545px;
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--text-faint);
        font-family: 'Geist Mono', monospace;
        font-size: 20px;
        line-height: 24px;
      }

      /* A haloed dot, as the app marks a live figure. */
      .site i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow:
          0 0 0 4px rgba(61, 123, 255, 0.16),
          0 0 14px rgba(61, 123, 255, 0.7);
      }

      /*
       * The Curate mark at about 10x (the favicon's paths, unthickened): a
       * navy hexagon lit from the middle, and the white ring, ticks and
       * icosahedron with a soft glow round them.
       */
      .mark {
        position: absolute;
        left: 768px;
        top: 120px;
        width: 346px;
        height: 396px;
      }

      .mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .mark .lines {
        filter: drop-shadow(0 0 3px rgba(170, 196, 255, 0.35))
          drop-shadow(0 0 24px rgba(61, 123, 255, 0.3));
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

        />
      </svg>
      <span>CURATE</span>
    </div>

    <div class="copy">
      <h1>
        <span>Obtain your verification,</span>
        <em>or earn by keeping lists clean.</em>
      </h1>
      <p>
        Curate verifies anything, at scale. Built to let good actors win:
        they get verified, or they get the bounty if they spot wrong entries.
      </p>
    </div>

    <div class="site"><i aria-hidden="true"></i>curate.kleros.io</div>

    </div>
  </body>
</html>
