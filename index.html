  <body>
    <script>
      // Apply the saved theme before React mounts, so the page never flashes.
      // Modes: system (default) | light | dark | kleros. See DESIGN.md.
      ;(function () {
        var backgrounds = { light: '#f5f7fc', dark: '#02040b', kleros: '#07001a' }
        // Must match DEFAULT_THEME_MODE in src/contexts/theme-context.tsx.
        var DEFAULT_MODE = 'system'
        var mode = DEFAULT_MODE
        try {
          var saved = localStorage.getItem('kleros-curate-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'kleros' || saved === 'system')
            mode = saved
        } catch (e) {}
        // ?cv-theme=light|dark|kleros previews a theme without saving it.
        var forced = new URLSearchParams(location.search).get('cv-theme')
        if (forced === 'light' || forced === 'dark' || forced === 'kleros') mode = forced
        var resolved = mode
        if (mode === 'system') {
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          resolved = prefersDark ? 'dark' : 'light'
        }
        document.body.setAttribute('data-theme', resolved)
        document.body.style.backgroundColor = backgrounds[resolved]
        document.body.style.colorScheme = resolved === 'light' ? 'light' : 'dark'
        if (resolved !== 'light') document.documentElement.classList.add('dark')
      })()
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
