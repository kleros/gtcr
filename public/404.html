<!doctype html>

  not have (public/_redirects). Plain on purpose: no app bundle, no fonts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found | Kleros Curate</title>
    <style>
      :root {
        color-scheme: light dark;
        --stage: #f5f7fc;
        --text: #0b1220;
        --muted: #4d5a6e;
        --primary: #2a63f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --stage: #02040b;
          --text: #f4f6fb;
          --muted: #a1abc0;
          --primary: #3d7bff;
        }
      }
      body {
        margin: 0;
        padding: 96px 16px;
        background: var(--stage);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 500;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        color: var(--primary);

    <main>
